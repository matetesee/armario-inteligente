<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estilo JB · 150 Looks con 15 Prendas</title>
</head>
<body style="margin:0;background:#EEF1F5;padding:18px 0">

<div id="sp">
  <div class="sp-bar"><div class="sp-bar-fill" id="spBar"></div></div>
  <header class="sp-top">
    <button class="sp-back" id="spBack" aria-label="Atrás">‹</button>
    <span class="sp-logo" id="spLogo">ESTILO JB</span>
    <span class="sp-count" id="spCount"></span>
  </header>
  <main class="sp-stage" id="spStage"></main>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
#sp,#sp *{box-sizing:border-box;margin:0;padding:0}
#sp{
  --bg:#FFFFFF; --bg2:#F7F9FC; --card:#FFFFFF; --card2:#F7F9FC; --line:#E5E9F0;
  --ink:#161A22; --soft:#6B7686;
  --accent:#1174E0; --accent2:#3E96F2; --danger:#E5342B; --danger2:#FF5B50;
  --shadow:0 8px 24px rgba(20,30,50,.08);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink);
  background:var(--bg);
  max-width:520px; margin:0 auto; min-height:84vh; position:relative;
  border-radius:18px; overflow:hidden; -webkit-font-smoothing:antialiased;
  box-shadow:var(--shadow);
}
#sp h1,#sp h2{font-family:'Inter',sans-serif;font-weight:800;line-height:1.2}

/* progress + header */
#sp .sp-bar{height:5px;background:#E9EDF3}
#sp .sp-bar-fill{height:100%;width:0;background:var(--accent);transition:width .45s cubic-bezier(.4,0,.2,1)}
#sp .sp-top{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#fff;border-bottom:1px solid var(--line)}
#sp .sp-back{background:none;border:none;color:var(--ink);font-size:26px;line-height:1;cursor:pointer;width:30px;text-align:left;opacity:0;pointer-events:none;transition:opacity .2s}
#sp .sp-back.show{opacity:1;pointer-events:auto}
#sp .sp-logo{font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--ink)}
#sp .sp-count{font-size:11px;font-weight:700;color:var(--soft);min-width:50px;text-align:right;letter-spacing:.02em}

#sp .sp-stage{padding:24px 18px 42px;animation:spIn .4s cubic-bezier(.2,.7,.2,1)}
@keyframes spIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* headings */
#sp .sp-h{font-size:24px;text-align:center;margin-bottom:6px;line-height:1.22;font-weight:800}
#sp .sp-h .am{color:var(--accent)}
#sp .sp-sub{text-align:center;color:var(--soft);font-size:14px;margin-bottom:22px}

/* option cards */
#sp .sp-grid{display:grid;gap:12px}
#sp .sp-grid.cols2{grid-template-columns:1fr 1fr}
#sp .sp-card{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:left;position:relative}
#sp .sp-card:hover{border-color:var(--accent)}
#sp .sp-card:active{transform:scale(.98)}
#sp .sp-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(17,116,224,.18)}
#sp .sp-thumb{width:100%;aspect-ratio:1/1;background:#F0F2F6;display:flex;align-items:center;justify-content:center;color:#9AA3B2;font-size:12px;text-align:center;padding:8px;font-weight:600}
#sp .sp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
#sp .sp-card.row{display:flex;align-items:center;gap:0;padding:0}
#sp .sp-label{padding:13px 15px;font-weight:600;font-size:15px;color:var(--ink)}
#sp .sp-cap{display:block;font-weight:500;font-size:12.5px;color:var(--soft);margin-top:2px}
#sp .sp-card.row .sp-label{padding:16px}
#sp .sp-card:not(.row) .sp-label{background:var(--accent);color:#fff;padding:12px 14px}
#sp .sp-arrow{margin-left:auto;margin-right:16px;color:var(--soft);font-size:22px;font-weight:700;line-height:1}
#sp .sp-check{margin-left:auto;margin-right:15px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:.15s}
#sp .sp-card.sel .sp-check{background:var(--accent);border-color:var(--accent)}

/* buttons */
#sp .sp-cta{display:block;width:100%;margin-top:22px;padding:16px;border:none;border-radius:12px;font-family:'Inter',sans-serif;font-weight:700;font-size:16px;color:#fff;cursor:pointer;background:var(--accent);transition:filter .15s;text-align:center;text-decoration:none}
#sp .sp-cta:hover{filter:brightness(.94)}
#sp .sp-cta:disabled{opacity:.4;cursor:not-allowed}
#sp .sp-cta.buy{background:var(--danger)}
#sp .sp-cta.buy:hover{filter:brightness(.95)}

/* inputs */
#sp .sp-input{width:100%;padding:16px;font-size:17px;text-align:center;font-family:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;outline:none}
#sp .sp-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(17,116,224,.14)}
#sp .sp-input::placeholder{color:#A7AFBD}

/* interstitial / empathy */
#sp .sp-inter{text-align:center;padding:14px 0}
#sp .sp-icon{width:72px;height:72px;border-radius:50%;margin:6px auto 18px;display:flex;align-items:center;justify-content:center;font-size:32px;background:#EAF2FE;border:1.5px solid #D6E8FC}
#sp .sp-inter h1{font-size:22px;margin-bottom:12px;font-weight:800}
#sp .sp-inter h1 .am{color:var(--accent)}
#sp .sp-inter p{color:var(--soft);font-size:15px;line-height:1.6;max-width:410px;margin:0 auto}
#sp .sp-quote{font-style:italic;color:var(--accent);font-size:14.5px;margin:14px auto 0;max-width:360px}
#sp .sp-empathy{background:#FFF6F5;border:1px solid #FBD9D6;border-left:4px solid var(--danger);border-radius:12px;padding:16px 18px;margin-top:18px;text-align:left;animation:spIn .35s}
#sp .sp-empathy b{color:var(--danger);display:block;margin-bottom:5px;font-size:14px}
#sp .sp-empathy p{color:var(--soft);font-size:13.5px;line-height:1.55;margin:0}

/* result + loader */
#sp .sp-result{text-align:center}
#sp .sp-vsbox{display:flex;gap:12px;margin:18px 0}
#sp .sp-vsbox > div{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:15px 10px;text-align:center}
#sp .sp-vsbox .lab{text-transform:uppercase;font-size:11px;letter-spacing:.04em;color:var(--soft);font-weight:700}
#sp .sp-vsbox .v{font-weight:800;font-size:22px;margin-top:5px}
#sp .sp-vsbox .nowb .v{color:var(--danger)} #sp .sp-vsbox .goalb .v{color:var(--accent)}
#sp .sp-metric{margin:14px 0;text-align:left}
#sp .sp-metric .ml{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;color:var(--soft);font-weight:600}
#sp .sp-track2{height:12px;background:#E9EDF3;border-radius:8px;overflow:hidden}
#sp .sp-fill2{height:100%;width:0;border-radius:8px;transition:width 1.3s cubic-bezier(.2,.7,.2,1)}
#sp .sp-fill2.now{background:var(--danger)}
#sp .sp-fill2.goal{background:linear-gradient(90deg,var(--danger2),#FFA23E,var(--accent))}
#sp .sp-attack{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:15px 16px;margin:18px 0;text-align:left}
#sp .sp-attack b{color:var(--accent);font-size:13px;display:block;margin-bottom:9px}
#sp .sp-attack .z{display:flex;align-items:center;gap:9px;font-size:14px;margin:6px 0;opacity:0;transform:translateX(-10px);transition:opacity .4s,transform .4s}
#sp .sp-attack .z.in{opacity:1;transform:none}
#sp .sp-attack .z .ck{color:var(--accent);font-weight:800}
#sp .sp-loader{text-align:center;padding:34px 0}
#sp .sp-forge{font-size:38px;animation:spPulse 1s ease-in-out infinite}
@keyframes spPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#sp .sp-ring{font-weight:800;font-size:40px;color:var(--accent);margin-top:10px}
#sp .sp-ltrack{height:8px;background:#E9EDF3;border-radius:6px;overflow:hidden;margin:18px 0}
#sp .sp-lfill{height:100%;width:0;background:var(--accent);transition:width .25s}

/* SALES */
#sp .sp-timer{position:sticky;top:0;z-index:5;background:#FFF1EF;color:var(--danger);text-align:center;padding:11px;font-weight:700;font-size:13.5px;border-bottom:1px solid #FBD9D6}
#sp .sp-timer span{font-weight:800;margin-left:6px}
#sp .sp-salebody{padding:26px 18px 42px}
#sp .sp-hero-img{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#F0F2F6;display:flex;align-items:center;justify-content:center;color:#9AA3B2;font-size:13px;margin:14px 0;border:1px solid var(--line)}
#sp .sp-hero-img img{width:100%;height:100%;object-fit:cover}
#sp .sp-won{background:#EAF6EC;border:1px solid #C9EBCD;border-radius:12px;padding:14px;text-align:center;margin-bottom:8px}
#sp .sp-won b{color:#1F9D3C}
#sp .sp-sec{margin:26px 0}
#sp .sp-sec-h{font-weight:800;font-size:19px;text-align:center;margin-bottom:16px}
#sp .sp-sec-h .am{color:var(--accent)}
#sp .sp-incl{list-style:none;display:grid;gap:10px}
#sp .sp-incl li{display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-size:14px}
#sp .sp-incl li .ck{color:var(--accent);font-weight:800;flex:none}
#sp .sp-how{display:grid;gap:13px}
#sp .sp-how .st{display:flex;gap:13px;align-items:flex-start}
#sp .sp-how .num{width:38px;height:38px;flex:none;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
#sp .sp-how .st b{font-size:15px;display:block;margin-bottom:2px}
#sp .sp-how .st p{color:var(--soft);font-size:13.5px;margin:0;line-height:1.45}
#sp .sp-tst{display:grid;gap:12px}
#sp .sp-tst .c{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
#sp .sp-tst .stars{color:#FFA83E;font-size:13px;letter-spacing:2px}
#sp .sp-tst .q{font-size:13.5px;line-height:1.55;margin:6px 0 8px;color:var(--ink)}
#sp .sp-tst .who{display:flex;justify-content:space-between;font-size:12.5px}
#sp .sp-tst .who b{color:var(--ink)}
#sp .sp-tst .who .res{color:var(--accent);font-weight:700}
#sp .sp-tier{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s}
#sp .sp-tier.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(17,116,224,.18)}
#sp .sp-tier.pop{border-color:var(--accent)}
#sp .sp-pop{position:absolute;top:-11px;left:16px;background:var(--danger);color:#fff;font-weight:700;font-size:11px;letter-spacing:.03em;padding:3px 11px;border-radius:20px}
#sp .sp-tier-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#sp .sp-tier-name{font-weight:700;font-size:15px}
#sp .sp-tier-old{color:var(--soft);text-decoration:line-through;font-size:13px;margin-right:6px}
#sp .sp-tier-now{font-weight:800;font-size:16px;color:var(--ink)}
#sp .sp-off{display:inline-block;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:5px}
#sp .sp-perday{text-align:right;flex:none}
#sp .sp-perday .pd{font-weight:800;font-size:22px;line-height:1;color:var(--accent)}
#sp .sp-perday .u{font-size:11px;color:var(--soft)}
#sp .sp-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-right:12px;display:inline-block;vertical-align:middle}
#sp .sp-tier.sel .sp-radio{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 40%,transparent 46%)}
#sp .sp-bonus{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--accent);font-weight:600}
#sp .sp-guar{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:18px 0;font-size:13px;color:var(--soft)}
#sp .sp-guar .g-ic{font-size:24px}
#sp .sp-proof{text-align:center;color:var(--soft);font-size:13px;margin-top:14px}
#sp .sp-proof b{color:var(--ink)}
#sp .sp-faq .it{border-bottom:1px solid var(--line)}
#sp .sp-faq .q{width:100%;text-align:left;background:none;border:none;color:var(--ink);font-size:14.5px;font-weight:600;padding:15px 28px 15px 0;cursor:pointer;position:relative}
#sp .sp-faq .q::after{content:'+';position:absolute;right:4px;top:11px;font-size:20px;color:var(--accent)}
#sp .sp-faq .it.open .q::after{content:'–'}
#sp .sp-faq .a{max-height:0;overflow:hidden;transition:max-height .25s ease;color:var(--soft);font-size:13.5px;line-height:1.55}
#sp .sp-faq .it.open .a{max-height:260px;padding-bottom:14px}
#sp .sp-disc{font-size:10.5px;color:#A7AFBD;text-align:center;margin-top:18px;line-height:1.5}
#sp .sp-auth{text-align:center;margin:24px 0}
#sp .sp-laurel{font-weight:800;font-size:32px;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:10px}
#sp .sp-laurel .lf{opacity:.85;font-size:26px}
#sp .sp-auth-sub{color:var(--soft);font-size:13px;margin-top:2px}
#sp .sp-stars{font-size:17px;color:#FFA83E;margin-top:14px;letter-spacing:2px}
#sp .sp-stars b{color:var(--ink)}
#sp .sp-pay{text-align:center;margin:14px 0 4px}
#sp .sp-pay > span{font-size:12px;color:var(--soft);display:block;margin-bottom:8px}
#sp .sp-cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#sp .sp-cards span{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-weight:600;font-size:11.5px;color:var(--ink)}
@media(max-width:430px){#sp .sp-grid.cols2{grid-template-columns:1fr 1fr}}
/* bonus grid */
#sp .sp-bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#sp .sp-bcard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#sp .sp-bcard img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
#sp .sp-bcard .bt{padding:12px 13px 4px;font-weight:700;font-size:13.5px}
#sp .sp-bcard .bd{padding:0 13px 13px;font-size:12px;color:var(--soft);line-height:1.5}
#sp .sp-launch{background:#161A22;color:#fff;text-align:center;padding:12px 14px;border-radius:10px;font-weight:700;font-size:13.5px;letter-spacing:.01em;margin:18px 0}
#sp .sp-authorbox{display:flex;gap:14px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0}
#sp .sp-authorbox img{width:68px;height:68px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--accent)}
#sp .sp-authorbox p{font-size:12.5px;color:var(--soft);line-height:1.55}
#sp .sp-authorbox b{color:var(--ink)}
</style>

<!-- ===== Componentes (slider / proyección / medidor) ===== -->
<style>
#sp .sp-sl-wrap{display:flex;flex-direction:column;align-items:center;width:100%;padding:12px 0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
#sp .sp-sl-val{font-size:2.4rem;font-weight:800;color:var(--ink);margin-bottom:18px;line-height:1}
#sp .sp-sl-track-wrap{position:relative;width:100%;height:44px;display:flex;align-items:center;cursor:pointer}
#sp .sp-sl-track{position:absolute;left:0;right:0;height:6px;border-radius:3px;background:var(--line);overflow:visible}
#sp .sp-sl-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--accent);pointer-events:none}
#sp .sp-sl-ticks{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);pointer-events:none}
#sp .sp-sl-tick{position:absolute;width:2px;height:10px;background:var(--line);border-radius:1px;transform:translate(-50%,-50%)}
#sp .sp-sl-tick.sp-sl-tick-filled{background:var(--accent);opacity:.5}
#sp .sp-sl-thumb{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px #fff,0 2px 10px rgba(17,116,224,.4);transform:translate(-50%,-50%);cursor:grab;z-index:2}
#sp .sp-sl-thumb:active{cursor:grabbing}
#sp .sp-pj-wrap{font-family:inherit;width:100%;box-sizing:border-box;padding:0 0 8px}
#sp .sp-pj-headline{color:var(--ink);font-size:1.05rem;font-weight:700;text-align:center;margin:0 0 12px}
#sp .sp-pj-svg{width:100%;display:block;overflow:visible}
#sp .sp-pj-axis-label{fill:var(--soft);font-size:11px;font-family:inherit}
#sp .sp-pj-weight-label{font-size:13px;font-weight:700;font-family:inherit}
#sp .sp-pj-dot{animation:sp-pj-pulse 1.8s ease-in-out infinite}
@keyframes sp-pj-pulse{0%,100%{opacity:1;r:5}50%{opacity:.5;r:8}}
#sp .sp-gg-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
#sp .sp-gg-label{font-size:.85rem;color:var(--soft);letter-spacing:.04em;text-transform:uppercase;text-align:center}
#sp .sp-gg-svg{width:100%;max-width:280px;display:block;margin:0 auto;overflow:visible}
#sp .sp-gg-value{font-size:2.2rem;font-weight:800;color:var(--ink);line-height:1;text-align:center;margin-top:-18px}
#sp .sp-gg-sublabel{font-size:.75rem;color:var(--soft);text-align:center;margin-top:2px}
</style>

<script>
function spSlider(opts){
  var o=Object.assign({min:0,max:100,value:50,step:1,unit:'',accent:null},opts);
  var cur=Math.min(o.max,Math.max(o.min,o.value));
  var wrap=document.createElement('div');wrap.className='sp-sl-wrap';wrap.setAttribute('tabindex','0');
  var val=document.createElement('div');val.className='sp-sl-val';
  var tw=document.createElement('div');tw.className='sp-sl-track-wrap';
  var track=document.createElement('div');track.className='sp-sl-track';
  var fill=document.createElement('div');fill.className='sp-sl-fill';
  var ticks=document.createElement('div');ticks.className='sp-sl-ticks';
  var thumb=document.createElement('div');thumb.className='sp-sl-thumb';
  var steps=Math.round((o.max-o.min)/o.step);
  var maxTicks=20;var tickEvery=Math.max(1,Math.ceil(steps/maxTicks));
  for(var i=0;i<=steps;i+=tickEvery){
    var t=document.createElement('div');t.className='sp-sl-tick';
    t.style.left=(i/steps*100)+'%';ticks.appendChild(t);
  }
  track.appendChild(fill);track.appendChild(ticks);track.appendChild(thumb);tw.appendChild(track);
  wrap.appendChild(val);wrap.appendChild(tw);
  function pct(){return(cur-o.min)/(o.max-o.min)}
  function render(){
    val.textContent=cur+(o.unit?' '+o.unit:'');
    var p=pct()*100;fill.style.width=p+'%';thumb.style.left=p+'%';
    var ts=ticks.querySelectorAll('.sp-sl-tick');var fi=pct()*steps/tickEvery;
    ts.forEach(function(t,i){t.classList.toggle('sp-sl-tick-filled',i<=fi);});
  }
  function snap(v){return Math.round((v-o.min)/o.step)*o.step+o.min}
  function clamp(v){return Math.min(o.max,Math.max(o.min,v))}
  function fromX(x){var r=track.getBoundingClientRect();return clamp(snap((x-r.left)/r.width*(o.max-o.min)+o.min));}
  function set(v){if(v===cur)return;cur=v;render();navigator.vibrate&&navigator.vibrate(8);}
  var drag=false;
  function onMove(x){if(drag){set(fromX(x));}}
  thumb.addEventListener('mousedown',function(e){drag=true;e.preventDefault();});
  document.addEventListener('mousemove',function(e){onMove(e.clientX);});
  document.addEventListener('mouseup',function(){drag=false;});
  thumb.addEventListener('touchstart',function(e){drag=true;e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',function(e){if(drag){onMove(e.touches[0].clientX);}},{passive:true});
  document.addEventListener('touchend',function(){drag=false;});
  tw.addEventListener('click',function(e){if(e.target===thumb)return;set(fromX(e.clientX));});
  wrap.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){set(clamp(snap(cur+o.step)));e.preventDefault();}
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){set(clamp(snap(cur-o.step)));e.preventDefault();}
  });
  wrap.getValue=function(){return cur;};
  render();return wrap;
}
function spProjection(opts){
  var fromKg=opts.fromKg,toKg=opts.toKg,weeks=opts.weeks||12,unit=opts.unit||'kg',
      name=(opts.name&&opts.name.trim())||'crack',label=opts.targetDateLabel||'Meta';
  var wrap=document.createElement('div');wrap.className='sp-pj-wrap';

    '<div class="sp-vsbox"><div class="nowb"><span class="lab">Looks hoy</span><div class="v">'+looksNow+'</div></div>'+
    '<div class="goalb"><span class="lab">Con el Manual</span><div class="v">'+looksGoal+'</div></div></div>'+
    '<div id="spProjHost" style="margin:22px 0 6px"></div>'+
    zHtml+
    '<button class="sp-cta" id="spBuild">Ver mi Manual</button></div>';

  document.getElementById('spProjHost').appendChild(spProjection({fromKg:looksNow, toKg:looksGoal, unit:' looks', name:A.name, targetDateLabel:'Con el Manual'}));

  zs.forEach(function(z,idx){ setTimeout(function(){ z.classList.add('in'); }, 700+idx*130); });

}
function runLoader(){
  stage.innerHTML='<div class="sp-loader"><div class="sp-forge">✨</div><div class="sp-ring" id="spPct">0%</div>'+
    '<div class="sp-ltrack"><div class="sp-lfill" id="spLF"></div></div>'+
    '<p class="sp-sub" id="spLT">Analizando tus respuestas…</p></div>';
  var p=0, msgs=[[0,'Analizando tus respuestas…'],[35,'Seleccionando tus 15 prendas clave…'],[70,'Armando tus 150 combinaciones…'],[92,'Afinando los últimos detalles…']];
  var pctEl=document.getElementById('spPct'),lf=document.getElementById('spLF'),lt=document.getElementById('spLT');
  var iv=setInterval(function(){ p+=Math.random()*7+2; if(p>=100)p=100;
    pctEl.textContent=Math.floor(p)+'%'; lf.style.width=p+'%';
    for(var k=msgs.length-1;k>=0;k--){ if(p>=msgs[k][0]){ lt.textContent=msgs[k][1]; break; } }
    if(p>=100){ clearInterval(iv); setTimeout(renderSale,550); } },180);
}

  var bonusSec='<div class="sp-sec"><h2 class="sp-sec-h">Qué vas a <span class="am">recibir</span></h2><div class="sp-bgrid">'+bcards+'</div>'+
    (CONFIG.LAUNCH_BONUS?'<div class="sp-launch">'+esc(CONFIG.LAUNCH_BONUS)+'</div>':'')+'</div>';
  var accessSec='<div class="sp-sec"><div class="sp-incl"><li style="list-style:none;display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-size:14px"><span class="ck" style="color:var(--accent);font-weight:800">✔</span><span><b>Acceso vitalicio.</b> Hacés un pago único de $9,90 USD y tenés el material siempre con vos.</span></li>'+
    '<li style="list-style:none;display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-size:14px;margin-top:10px"><span class="ck" style="color:var(--accent);font-weight:800">✔</span><span><b>Garantía de 7 días.</b> Devolución total del dinero si no quedás conforme.</span></li></div></div>';
  var how=(CONFIG.HOW||[]).map(function(s){return '<div class="st"><div class="num">'+esc(s.n)+'</div><div><b>'+esc(s.t)+'</b><p>'+esc(s.d)+'</p></div></div>';}).join('');
  var howSec=how?'<div class="sp-sec"><h2 class="sp-sec-h">El <span class="am">camino</span></h2><div class="sp-how">'+how+'</div></div>':'';
  var tst=(CONFIG.TESTIMONIALS||[]).map(function(x){return '<div class="c"><div class="stars">★★★★★</div><p class="q">"'+esc(x.text)+'"</p><div class="who"><b>'+esc(x.name)+'</b><span class="res">'+esc(x.result)+'</span></div></div>';}).join('');
  var tstSec='<div class="sp-sec"><h2 class="sp-sec-h">Mujeres <span class="am">reales</span></h2>'+
    '<img src="'+CONFIG.IMG.alunas+'" alt="Alumnas" style="width:100%;border-radius:12px;margin-bottom:12px;display:block">'+
    '<div class="sp-tst">'+tst+'</div>'+
    '<img src="'+CONFIG.IMG.depoimentos+'" alt="Testimonios" style="width:100%;border-radius:12px;margin-top:12px;display:block">'+
    '</div>';
  var faq=(CONFIG.FAQ||[]).map(function(x){return '<div class="it"><button class="q">'+esc(x.q)+'</button><div class="a">'+esc(x.a)+'</div></div>';}).join('');
  var faqSec=faq?'<div class="sp-sec sp-faq"><h2 class="sp-sec-h">Preguntas <span class="am">frecuentes</span></h2>'+faq+'</div>':'';
  var authorSec='<div class="sp-sec"><h2 class="sp-sec-h">¿Quién es <span class="am">Ju Bacellar</span>?</h2>'+
    '<div class="sp-authorbox"><img src="'+CONFIG.IMG.ju_photo+'" alt="Ju Bacellar">'+
    '<p><b>Juliana Bacellar</b> es referente en Consultoría de Imagen, con más de 15 años de experiencia y más de 10.000 mujeres impactadas por sus cursos. Creadora de JB Academy, desarrolló una metodología propia que une estilo, estrategia y autoestima. Su trabajo fue destacado en revistas como Vogue, IstoÉ, Caras y L’Officiel.</p></div></div>';
  var authority='<div class="sp-sec sp-auth"><div class="sp-laurel"><span class="lf">🌿</span><span>+10.400</span><span class="lf">🌿</span></div>'+

  var pay='<div class="sp-pay"><span>🔒 Pago 100% seguro, vía Hotmart</span><div class="sp-cards"><span>VISA</span><span>Mastercard</span><span>Amex</span><span>PayPal</span><span>PIX</span></div></div>';

  stage.style.padding='0';

    bonusSec + accessSec + howSec +
    '<div class="sp-sec"><h2 class="sp-sec-h">150 Looks con 15 Prendas: <span class="am">El Manual</span></h2>'+tiers+
    '<a class="sp-cta buy" id="spBuy" href="#" target="_blank" rel="noopener">¡Quiero mi Manual!</a></div>'+
    pay +
    '<div class="sp-guar"><span class="g-ic">🛡️</span><div><b style="color:var(--ink)">Garantía de 7 días.</b> Si no te sentís más segura combinando tus looks, te devolvemos el 100%. Sin preguntas.</div></div>'+
    authority + tstSec + authorSec + faqSec +

    '<p class="sp-disc">*Resultados ilustrativos. Los resultados individuales pueden variar según tu estilo personal y dedicación. Al inscribirte serás dirigida a la plataforma de pago de forma segura.</p>'+
    '</div></div>';

  function paint(){ stage.querySelectorAll('.sp-tier').forEach(function(el){ el.classList.toggle('sel',+el.dataset.i===state.tier); }); upd(); }
  function upd(){ var t=CONFIG.TIERS[state.tier],b=document.getElementById('spBuy'); b.href=(t.checkoutUrl||CONFIG.CHECKOUT_URL||'#'); }
  stage.querySelectorAll('.sp-tier').forEach(function(el){ el.onclick=function(){ state.tier=+el.dataset.i; paint(); }; });
  stage.querySelectorAll('.sp-faq .q').forEach(function(b){ b.onclick=function(){ b.parentElement.classList.toggle('open'); }; });
  upd();
  var total=CONFIG.TIMER_MIN*60, clock=document.getElementById('spClock');
  var ci=setInterval(function(){ total--; if(total<0){clearInterval(ci);return;} var m=Math.floor(total/60),s=total%60; clock.textContent=m+':'+(s<10?'0':'')+s; },1000);
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
})();
</script>
